name: Feature Request
description: Suggest an enhancement or workflow improvement for Embershot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow or Problem
      description: What capture, annotation, inspection, or export task are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Enhancement
      description: Describe how you would like this feature to work.
    validations:
      required: true
